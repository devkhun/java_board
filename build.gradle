plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spring Boot 기본 웹 스타터 (JPA와 REST API를 사용할 경우)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Starter Validation (데이터 검증을 위해 사용할 수 있음)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation("org.mariadb.jdbc:mariadb-java-client")
    implementation('com.h2database:h2')
    // MySQL JDBC 드라이버
    implementation 'mysql:mysql-connector-java:8.0.26'

    //Springfox swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    //Spring Boot 애플리케이션의 테스트를 위해 필요한 스프링 부트 스타터 테스트 라이브러리
    testImplementation("org.springframework.boot:spring-boot-starter-test")

    //MockK : 테스트에서 가짜 객체를 생성하고 행위를 확인하는 데 사용
    testImplementation("io.mockk:mockk:1.13.9")

    // Kotest의 JUnit 5 실행기를 프로젝트에 추가.
    // Kotest는 Kotlin으로 작성된 강력한 단위 테스트 및 행위 테스트 프레임워크
    testImplementation("io.kotest:kotest-runner-junit5:5.7.2")
}

tasks.named('test') {
    useJUnitPlatform()
}
